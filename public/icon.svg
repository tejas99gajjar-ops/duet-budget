<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>

    <!-- Mountain: radial gradient from peak outward → vivid gold → orange → violet → deep purple -->
    <radialGradient id="mtn" cx="58" cy="26" r="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFD040"/>
      <stop offset="26%"  stop-color="#FF6020"/>
      <stop offset="56%"  stop-color="#A028E0"/>
      <stop offset="100%" stop-color="#200CA0"/>
    </radialGradient>

    <!-- Bars: deep teal base → vivid bright green top -->
    <linearGradient id="bar" x1="0" y1="96" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#087050"/>
      <stop offset="100%" stop-color="#20F4A0"/>
    </linearGradient>

    <!-- Sun bloom (amber/gold — visible on any background) -->
    <filter id="bloom" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Tallest bar glow -->
    <filter id="bgl" x="-100%" y="-80%" width="300%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Mountain drop shadow (aids legibility on white backgrounds) -->
    <filter id="sh" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="4" flood-color="#30008A" flood-opacity="0.20"/>
    </filter>

  </defs>

  <!-- ═══ TRANSPARENT BACKGROUND — no background rect ═══ -->

  <!-- Sun corona (vivid amber glow — visible on any background) -->
  <circle cx="58" cy="20" r="26" fill="#FF9020" opacity="0.12"/>
  <circle cx="58" cy="20" r="16" fill="#FFB020" opacity="0.20"/>

  <!-- Sun disc with golden bloom -->
  <circle cx="58" cy="20" r="10" fill="#FFD040" filter="url(#bloom)"/>
  <!-- Hot white core -->
  <circle cx="58" cy="20" r="5"  fill="#FFFFFF"/>

  <!-- Mountain silhouette: glows gold at peak, deepens to rich violet/purple at base -->
  <g filter="url(#sh)">
    <path d="M0 96 L36 52 L54 64 L58 26 L108 96Z" fill="url(#mtn)"/>
    <!-- Ridge rim light: warm golden edge where peak meets sun -->
    <path d="M36 52 L58 26" stroke="rgba(255,230,80,0.60)" stroke-width="1.6"
          fill="none" stroke-linecap="round"/>
    <!-- Peak tip bright highlight -->
    <circle cx="58" cy="26" r="2.5" fill="rgba(255,248,180,0.90)"/>
  </g>

  <!-- 4 ascending bars (vivid brand green, over mountain) -->
  <rect x="10" y="80" width="10" height="14" rx="2.5" fill="url(#bar)"/>
  <rect x="23" y="72" width="10" height="22" rx="2.5" fill="url(#bar)"/>
  <rect x="36" y="62" width="10" height="32" rx="2.5" fill="url(#bar)"/>
  <rect x="49" y="50" width="10" height="44" rx="2.5" fill="url(#bar)" filter="url(#bgl)"/>

  <!-- Bar cap highlights -->
  <rect x="10" y="80" width="10" height="1.5" rx="1.5" fill="rgba(255,255,255,0.75)"/>
  <rect x="23" y="72" width="10" height="1.5" rx="1.5" fill="rgba(255,255,255,0.75)"/>
  <rect x="36" y="62" width="10" height="1.5" rx="1.5" fill="rgba(255,255,255,0.75)"/>
  <rect x="49" y="50" width="10" height="1.5" rx="1.5" fill="rgba(255,255,255,0.85)"/>

</svg>
